# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-knx against the independent implementations of otfabric/knx-interop
# (Calimero, knxd, xknx, KNXUltimate, cB-Sigma knx and knx-sim): the host-based suite (go-knx's
# tunnelling client against Calimero's and knxd's servers, their clients
# against go-knx's server), then knx-interop's whole matrix inside one
# Docker network with go-knx's own adapter (interop/node, built from this
# commit) as the system under test.
# Published knx-interop images are pinned by digest (interop/harness_test.go);
# the Calimero and knxd images are built from knx-interop's source at
# INTEROP_REF (default v0.9.2).

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_call:
    inputs:
      interop-ref:
        description: knx-interop ref to build the adapters from
        type: string
        default: v0.9.2
  workflow_dispatch:
    inputs:
      interop-ref:
        description: knx-interop ref to build the adapters from
        default: v0.9.2

permissions:
  contents: read

jobs:
  interop:
    name: Interop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the knx-interop adapter images
        run: make interop-images INTEROP_REF=${{ inputs.interop-ref || 'v0.9.2' }}
      - name: Interop suite
        run: make interop
      - name: knx-interop matrix with go-knx's node
        run: make interop-matrix INTEROP_REF=${{ inputs.interop-ref || 'v0.9.2' }}
      - name: Matrix summary
        if: always()
        run: '[ -f bin/interop-matrix.md ] && cat bin/interop-matrix.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Summary
        if: always()
        run: |
          [ -f bin/interop-report.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          d = json.load(open("bin/interop-report.json"))
          c = collections.Counter(r["result"] for r in d["results"])
          print("## Interop results\n")
          print(", ".join(f"{k}: {v}" for k, v in sorted(c.items())) + "\n")
          print("| Peer | Version | Scenario | Result | Detail |\n|---|---|---|---|---|")
          for r in d["results"]:
              print(f"| {r['peer']} | {r.get('peerVersion','')} | {r['scenario']} | {r['result']} | {r.get('detail','')[:120]} |")
          PY
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-report-${{ matrix.arch }}
          path: |
            bin/interop-report.json
            bin/interop-matrix.json
            bin/interop-matrix.md
          if-no-files-found: warn
